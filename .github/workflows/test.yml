name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv venv && uv pip install "$(ls dist/*.whl)[all]" pytest && uv run --no-project python -I -m pytest -q tests
